# Publish to npm via trusted publishing (OIDC, no long-lived token).
#
# npm side (one-time, done by the repo owner at npmjs.com):
#   package dev-diagnosis-cli -> Settings -> Publishing access ->
#   Trusted publisher: GitHub Actions, repository WJDdidi-1/dev-doctor,
#   workflow publish.yml (this file), no environment.
# After that, creating a GitHub release publishes the tagged version.
# Manual runs are also possible from the Actions tab (workflow_dispatch).

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm publish --provenance --access public
